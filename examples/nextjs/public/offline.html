<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #fff; color: #111;
      }
      @media (prefers-color-scheme: dark) { body { background: #1f1f1f; color: #e8eaed; } }
      h1 { font-size: 22px; font-weight: 600; margin: 0; }
      p { margin: 0; max-width: 360px; font-size: 14px; opacity: 0.75; line-height: 1.5; }
      button {
        margin-top: 8px; padding: 12px 22px; border: 0; border-radius: 999px;
        background: #1a73e8; color: #fff; font: inherit; font-size: 14px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>This page isn't available without a connection. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </body>
</html>

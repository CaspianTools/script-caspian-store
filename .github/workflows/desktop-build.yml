name: Desktop — Windows register installer

# Builds desktop/ into a Windows installer (.exe).
#
# This lives in CI rather than on a maintainer's machine because the shell is
# Rust and most of the people who maintain this repo do not have a Rust
# toolchain. workflow_dispatch is the iteration path; a `desktop/v*` tag cuts
# the actual release, matching how `create-caspian-store/v*` already works.
#
# The installer is UNSIGNED. Windows SmartScreen will warn on it until the
# binary is signed with an OV/EV certificate — see desktop/README.md. Signing
# is a procurement decision, not a code change, so it is deliberately not
# wired up with a placeholder secret that would fail every build.

on:
  push:
    tags: ['desktop/v*']
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm install --no-audit --no-fund

      # The repo commits only source icons. `tauri icon` derives the full set,
      # including the .ico that the Windows bundler requires, so no binary that
      # nobody can regenerate is checked in.
      - name: Generate icons
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon.png

      # Code signing is what removes the "Windows protected your PC" screen.
      # It is skipped, not failed, when no certificate is configured -- so the
      # build keeps working for anyone who has not bought one yet, and starts
      # producing signed installers the moment the secrets exist.
      - name: Configure code signing
        id: signing
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        working-directory: desktop
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath -Force

          # Tauri signs during the bundle step when the config names a thumbprint,
          # which is why this is patched in rather than signed post-hoc.
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $conf.bundle.windows) {
            $conf.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{})
          }
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $conf.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue 'sha256' -Force
          $conf.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue 'http://timestamp.digicert.com' -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding utf8
          Write-Host "Signing enabled with certificate $($cert.Thumbprint)"

      # The cargo cache carries desktop/src-tauri/target between runs, and that
      # includes the previous release's bundle/. Without this the collect step
      # globs a directory holding two installers and can pick the older one --
      # which is exactly what happened on the first 0.2.0 build, where a
      # correctly-produced 0.2.0 installer was rejected because the cached
      # 0.1.0 one sorted first.
      - name: Clear stale bundles
        shell: pwsh
        working-directory: desktop
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          if (Test-Path $bundle) {
            Get-ChildItem -Recurse -Path $bundle -Filter *-setup.exe |
              ForEach-Object { Write-Host "Removing cached installer: $($_.Name)" }
            Remove-Item -Recurse -Force $bundle
          }

      - name: Build the installer
        working-directory: desktop
        run: npx tauri build

      - name: Collect the installer
        id: collect
        shell: pwsh
        working-directory: desktop
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $all = @(Get-ChildItem -Recurse -Path src-tauri/target/release/bundle -Filter *-setup.exe)
          if ($all.Count -eq 0) { Write-Error "No installer produced"; exit 1 }
          if ($all.Count -gt 1) {
            Write-Error "Expected exactly one installer, found $($all.Count): $($all.Name -join ', '). Two installers means the choice is ambiguous and the wrong one can ship."
            exit 1
          }
          $exe = $all[0]

          # A shop keeps installers in a downloads folder for years, and a support
          # call opens with "which one are you running?". An unversioned filename
          # makes that unanswerable, so this is asserted rather than assumed --
          # a bundler default is not a guarantee.
          if ($exe.Name -notmatch [regex]::Escape($version)) {
            Write-Error "Installer '$($exe.Name)' does not carry version '$version'. See CLAUDE.md step 14."
            exit 1
          }

          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $sig = Get-AuthenticodeSignature $exe.FullName
          "signed=$($sig.Status -eq 'Valid')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built $($exe.Name) ($([math]::Round($exe.Length/1MB,2)) MB), version $version, signature: $($sig.Status)"
          if ($sig.Status -ne 'Valid') {
            Write-Warning "UNSIGNED build. Windows SmartScreen will warn on first run. See desktop/README.md."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: caspian-register-windows-${{ steps.collect.outputs.version }}
          path: ${{ steps.collect.outputs.path }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/desktop/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ steps.collect.outputs.path }}" `
            --title "Caspian Register ${{ github.ref_name }}" `
            --notes "Windows installer for the Caspian Store register. Unsigned - Windows SmartScreen will warn on first run until the binary is code-signed. See desktop/README.md."

          # Read the URL back rather than composing it: the tag contains a slash,
          # and a hand-built link is a link that can silently be wrong.
          $url = gh api "repos/${{ github.repository }}/releases/tags/$([uri]::EscapeDataString('${{ github.ref_name }}'))" --jq '.assets[0].browser_download_url'
          Write-Host "Installer: $url"
          "## Caspian Register ${{ steps.collect.outputs.version }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Direct download: <$url>" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

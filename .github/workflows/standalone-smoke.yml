name: Standalone till — behaviour smoke

# Guards the till in `apps/pos`: a register with no shop, no website and no
# Firebase project behind it, where this machine holds the only copy of a
# shop's catalogue, staff and takings.
#
# Two things here are expensive to get wrong and invisible to `tsc`: what a
# customer is actually charged, and whether a CSV export/import round-trip
# preserves a catalogue. Both are pure functions by design — the money
# arithmetic was split out of the IndexedDB transaction into `priceLocalSale`
# precisely so it could be checked in CI without a browser.
#
# The till left this package in v14.0.0, so the guard no longer runs against the
# library's `dist/`. It runs against the till's own SSR bundle of
# `src/check-entry.ts`, which is what `npm run check` builds.

on:
  push:
    branches: [main]
    paths:
      - 'apps/pos/**'
      - 'src/utils/csv.ts'
      - 'src/services/import-export/helpers.ts'
      - '.github/workflows/standalone-smoke.yml'
  pull_request:
    paths:
      - 'apps/pos/**'
      - 'src/utils/csv.ts'
      - 'src/services/import-export/helpers.ts'
      - '.github/workflows/standalone-smoke.yml'
  workflow_dispatch:

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No cache — this repo doesn't commit package-lock.json by policy.

      - name: Install library deps
        run: npm install --ignore-scripts --no-audit --no-fund

      # The till consumes the library through `file:../..`, so it needs a built
      # `dist/` to link against before its own install.
      - name: Build the library
        run: npm run build

      - name: Install till deps
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: apps/pos

      - name: Type-check the till
        run: npm run typecheck
        working-directory: apps/pos

      - name: Check standalone behaviour
        run: npm run check
        working-directory: apps/pos

<html lang="en" data-theme="auto">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Caspian Store — Register manual</title>
<meta name="description" content="The in-person register: installing it, the hardware, cashier access, a day at the counter, and winding a till down.">
<!-- DOC:HEAD:END -->
<style>
/* ---------------------------------------------------------------------------
   Design tokens. Light is the base; dark overrides only the colour roles, so a
   value can never be defined in exactly one of the two and go missing.
   --------------------------------------------------------------------------- */
/* TOKENS:START — the design tokens, shared verbatim with docs/index.html. */
:root {
  --bg:            #ffffff;
  --bg-subtle:     #f7f7f8;
  --surface:       #ffffff;
  --surface-2:     #f4f4f5;
  --border:        #e4e4e7;
  --border-strong: #d4d4d8;
  --text:          #18181b;
  --text-muted:    #62626b;
  --text-faint:    #8e8e97;
  --accent:        #1d4ed8;
  --accent-weak:   #eff4ff;
  --accent-text:   #1d4ed8;
  --warn:          #92650e;
  --warn-weak:     #fdf6e3;
  --warn-border:   #eedcae;
  --mark-bg:       #fde68a;
  --mark-text:     #18181b;
  --shadow:        0 1px 2px rgba(24, 24, 27, .06), 0 8px 24px rgba(24, 24, 27, .06);

  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;

  --sidebar-w: 286px;
  --header-h: 61px;
  --radius: 10px;
  --maxw: 780px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:            #0d0d0f;
    --bg-subtle:     #121214;
    --surface:       #151517;
    --surface-2:     #1c1c20;
    --border:        #2a2a30;
    --border-strong: #3a3a42;
    --text:          #f2f2f3;
    --text-muted:    #a2a2ad;
    --text-faint:    #74747f;
    --accent:        #7ea6ff;
    --accent-weak:   #16203a;
    --accent-text:   #9dbaff;
    --warn:          #e8c877;
    --warn-weak:     #2a2313;
    --warn-border:   #4a3d1c;
    --mark-bg:       #6b5312;
    --mark-text:     #fdf6e3;
    --shadow:        0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .4);
  }
}

:root[data-theme="dark"] {
  --bg:            #0d0d0f;
  --bg-subtle:     #121214;
  --surface:       #151517;
  --surface-2:     #1c1c20;
  --border:        #2a2a30;
  --border-strong: #3a3a42;
  --text:          #f2f2f3;
  --text-muted:    #a2a2ad;
  --text-faint:    #74747f;
  --accent:        #7ea6ff;
  --accent-weak:   #16203a;
  --accent-text:   #9dbaff;
  --warn:          #e8c877;
  --warn-weak:     #2a2313;
  --warn-border:   #4a3d1c;
  --mark-bg:       #6b5312;
  --mark-text:     #fdf6e3;
  --shadow:        0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .4);
}
/* TOKENS:END */

* { box-sizing: border-box; }

/* Author rules beat the user-agent [hidden] rule, so anything with an explicit
   display (nav links, part heads, the card grid) ignored .hidden = true and the
   search filtered nothing. Everything here hides through this one rule. */
[hidden] { display: none !important; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

.icon { width: 18px; height: 18px; flex: none; stroke-width: 1.9; }
.icon-lg { width: 22px; height: 22px; }

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 100;
  background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 0 0 8px 0;
}
.skip:focus { left: 0; }

/* --- Header ---------------------------------------------------------------- */
header.top {
  position: sticky; top: 0; z-index: 40;
  height: var(--header-h);
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(10px);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--text); color: var(--bg); flex: none;
}
.brand-mark .icon { width: 17px; height: 17px; stroke-width: 1.9; }
.brand-name { font-weight: 620; letter-spacing: -.012em; white-space: nowrap; }
.brand-sub {
  font-size: 12px; color: var(--text-faint); white-space: nowrap;
  border-inline-start: 1px solid var(--border); padding-inline-start: 10px; margin-inline-start: 2px;
}

.top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }

.search-wrap { position: relative; display: flex; align-items: center; }
.search-wrap .icon { position: absolute; inset-inline-start: 10px; color: var(--text-faint); pointer-events: none; }
input.search {
  width: 210px; height: 36px;
  padding: 0 12px 0 34px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--text);
  font: inherit; font-size: 14px;
}
input.search::placeholder { color: var(--text-faint); }
input.search:focus { background: var(--surface); border-color: var(--border-strong); }

/* Segmented language control */
.seg {
  display: flex; align-items: center; gap: 2px;
  padding: 3px; border: 1px solid var(--border); border-radius: 9px;
  background: var(--surface-2);
}
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--text-muted);
  font: inherit; font-size: 13px; font-weight: 520;
  padding: 5px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] {
  background: var(--surface); color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

.icon-btn {
  appearance: none; width: 36px; height: 36px; flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface-2); color: var(--text-muted); cursor: pointer;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); }

#nav-toggle { display: none; }

/* --- Layout ---------------------------------------------------------------- */
.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  align-items: start;
}

nav.toc {
  position: sticky; top: var(--header-h);
  height: calc(100dvh - var(--header-h));
  overflow-y: auto; overscroll-behavior: contain;
  padding: 22px 12px 60px 20px;
  border-inline-end: 1px solid var(--border);
}

.toc-part { margin-bottom: 4px; }
.toc-part > .toc-part-label {
  appearance: none; width: 100%; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px;
  border: 0; border-radius: 7px; background: transparent;
  font: inherit;
  font-size: 11.5px; font-weight: 640; letter-spacing: .055em; text-transform: uppercase;
  color: var(--text-faint); text-align: start;
}
.toc-part > .toc-part-label:hover { background: var(--surface-2); color: var(--text-muted); }
.toc-part > .toc-part-label .icon { width: 15px; height: 15px; stroke-width: 2.1; }
.toc-part-title { flex: 1 1 auto; min-width: 0; }
.toc-part-label .chev {
  width: 14px; height: 14px; margin-inline-start: auto;
  transition: transform .15s ease;
}
.toc-part.open > .toc-part-label { color: var(--text-muted); }
.toc-part.open > .toc-part-label .chev { transform: rotate(90deg); }
/* The group you are currently reading, so a collapsed sidebar still says where
   you are. */
.toc-part[data-active] > .toc-part-label { color: var(--accent-text); }
.toc-links { padding-bottom: 10px; }
@media (prefers-reduced-motion: reduce) {
  .toc-part-label .chev { transition: none; }
}

nav.toc a {
  display: block;
  padding: 6px 10px;
  border-radius: 7px;
  font-size: 14px; line-height: 1.4;
  color: var(--text-muted);
  border-inline-start: 2px solid transparent;
}
nav.toc a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
nav.toc a[aria-current="true"] {
  color: var(--accent-text); background: var(--accent-weak);
  border-inline-start-color: var(--accent); font-weight: 560;
}

main {
  padding: 40px 32px 120px;
  min-width: 0;
}
.wrap { max-width: var(--maxw); margin: 0 auto; }

/* --- Intro ---------------------------------------------------------------- */
.intro { margin-bottom: 44px; }
.intro h1 {
  font-size: clamp(28px, 4vw, 38px); line-height: 1.15; letter-spacing: -.028em;
  font-weight: 680; margin: 0 0 12px;
}
.intro p { color: var(--text-muted); font-size: 17px; margin: 0 0 16px; max-width: 62ch; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 24px; }
.card {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 14px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: inherit;
}
.card:hover { border-color: var(--border-strong); text-decoration: none; box-shadow: var(--shadow); }
.card .icon { color: var(--accent); margin-top: 2px; }
.card b { display: block; font-weight: 590; font-size: 14.5px; }
.card span { display: block; font-size: 13px; color: var(--text-muted); line-height: 1.5; }

/* --- Sections -------------------------------------------------------------- */
.part-head {
  display: flex; align-items: center; gap: 10px;
  margin: 56px 0 4px; padding-top: 26px;
  border-top: 1px solid var(--border);
  color: var(--text-faint);
  font-size: 12px; font-weight: 640; letter-spacing: .06em; text-transform: uppercase;
}
.part-head:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }

section.doc { scroll-margin-top: calc(var(--header-h) + 18px); padding: 18px 0 6px; }
section.doc h2 {
  font-size: 23px; letter-spacing: -.018em; font-weight: 640;
  margin: 0 0 6px; display: flex; align-items: center; gap: 9px;
}
section.doc h2 .anchor {
  opacity: 0; color: var(--text-faint); font-size: 16px; transition: opacity .12s;
}
section.doc h2:hover .anchor { opacity: 1; }
section.doc > p { color: var(--text-muted); margin: 0 0 14px; }

.meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2);
  font-size: 12px; color: var(--text-muted); white-space: nowrap;
}
.chip .icon { width: 13px; height: 13px; stroke-width: 2.1; }
.chip code { font-family: var(--mono); font-size: 11.5px; color: var(--text); }

h3.block-label {
  display: flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 620; letter-spacing: .045em; text-transform: uppercase;
  color: var(--text-faint);
  margin: 22px 0 10px;
}
h3.block-label .icon { width: 14px; height: 14px; stroke-width: 2.1; }

ol.steps { counter-reset: s; list-style: none; margin: 0; padding: 0; }
ol.steps li {
  counter-increment: s;
  position: relative;
  padding: 0 0 12px 34px;
  border-inline-start: 1.5px solid var(--border);
  margin-inline-start: 11px;
}
ol.steps li:last-child { border-inline-start-color: transparent; padding-bottom: 0; }
ol.steps li::before {
  content: counter(s);
  position: absolute; inset-inline-start: -11.5px; top: -2px;
  width: 22px; height: 22px; border-radius: 999px;
  display: grid; place-items: center;
  background: var(--surface); border: 1.5px solid var(--border-strong);
  font-size: 11.5px; font-weight: 640; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

table.fields { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.fields th {
  text-align: start; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-faint); font-weight: 620;
  padding: 0 12px 7px 0; border-bottom: 1px solid var(--border);
}
table.fields td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
table.fields td:first-child { font-weight: 550; white-space: nowrap; width: 1%; }
table.fields td:last-child { color: var(--text-muted); padding-inline-end: 0; }
.req {
  display: inline-block; margin-inline-start: 6px;
  font-size: 10.5px; font-weight: 620; letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent-text);
}

ul.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.notes li {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 13px; border-radius: var(--radius);
  background: var(--warn-weak); border: 1px solid var(--warn-border);
  font-size: 14.5px; color: var(--text);
}
ul.notes li .icon { color: var(--warn); margin-top: 2px; }

.fallback-note {
  display: flex; gap: 9px; align-items: flex-start;
  margin: 0 0 16px; padding: 10px 12px;
  border: 1px dashed var(--border-strong); border-radius: var(--radius);
  font-size: 13.5px; color: var(--text-muted); background: var(--bg-subtle);
}
.fallback-note .icon { color: var(--text-faint); margin-top: 2px; }

code:not(pre code) {
  font-family: var(--mono); font-size: .88em;
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 1px 5px; border-radius: 5px; white-space: nowrap;
}

.empty {
  padding: 60px 20px; text-align: center; color: var(--text-muted);
}

mark.hit {
  background: var(--mark-bg); color: var(--mark-text);
  border-radius: 3px; padding: 0 1px;
}

footer.bottom {
  border-top: 1px solid var(--border);
  padding: 22px 0 0; margin-top: 60px;
  font-size: 13px; color: var(--text-faint);
  display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
}

/* --- Responsive ------------------------------------------------------------ */
@media (max-width: 1000px) {
  :root { --sidebar-w: 0px; }
  #nav-toggle { display: grid; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.toc {
    position: fixed; inset: var(--header-h) 0 0 0;
    height: auto; width: 100%;
    background: var(--bg); z-index: 30;
    border-inline-end: 0;
    display: none;
  }
  nav.toc.open { display: block; }
  main { padding: 28px 20px 100px; }
  .brand-sub { display: none; }
  input.search { width: 140px; }
}
@media (max-width: 640px) {
  header.top { gap: 8px; padding: 0 12px; }
  .brand-name { display: none; }
  input.search { width: 34px; padding-inline-end: 4px; }
  input.search:focus { width: 160px; padding-inline-end: 12px; }
  .seg button { padding: 5px 7px; font-size: 12px; }
}

/* --- Print ----------------------------------------------------------------- */
.sibling {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 11px;
  border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--surface); color: var(--text);
  font-size: 13px; font-weight: 550; text-decoration: none; white-space: nowrap;
}
.sibling:hover { background: var(--surface-2); }
.part-head { scroll-margin-top: calc(var(--header-h) + 18px); }
section.doc { scroll-margin-top: calc(var(--header-h) + 18px); }
.empty a { color: var(--accent); font-weight: 600; }
@media (max-width: 760px) { .sibling span { display: none; } .sibling { padding: 0 8px; } }
@media print {
  header.top, nav.toc, .top-actions, .card, .anchor { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  .wrap { max-width: none; }
  section.doc { page-break-inside: avoid; }
  body { font-size: 11pt; color: #000; background: #fff; }
  a { color: #000; text-decoration: none; }
  ul.notes li { border: 1px solid #999; background: #fff; }
  mark.hit { background: transparent; color: inherit; }
}
</style>
</head>

const $ = (sel, root = document) => root.querySelector(sel);
const LANG_KEY = 'caspian:manual:lang';
const THEME_KEY = 'caspian:manual:theme';

function store(key, value) {
  try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch {}
}
function read(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

/** Language precedence: ?lang= in the URL, then this device's saved choice, then
 *  the browser's own preference, then English. */
function initialLang() {
  const codes = LANGS.map((l) => l.code);
  const fromUrl = new URLSearchParams(location.search).get('lang');
  if (codes.includes(fromUrl)) return fromUrl;
  const saved = read(LANG_KEY);
  if (codes.includes(saved)) return saved;
  for (const nav of navigator.languages || [navigator.language || '']) {
    const primary = String(nav).toLowerCase().split('-')[0];
    if (codes.includes(primary)) return primary;
  }
  return 'en';
}

let lang = initialLang();

const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
};

const icon = (id, cls = 'icon') => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', cls);
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#' + id);
  svg.append(use);
  return svg;
};

function t(key) {
  return (UI[lang] && UI[lang][key]) || UI.en[key] || key;
}

/** Merge a translated tree over the English one, section by section, so a
 *  missing translation degrades to English instead of vanishing. */
function subtitle() {
  return DOC.subtitle[lang] || DOC.subtitle.en;
}

function siblingLabel() {
  return DOC.sibling.label[lang] || DOC.sibling.label.en;
}

function resolved() {
  const base = MANUAL.en;
  const over = MANUAL[lang] || {};
  const overParts = new Map((over.parts || []).map((p) => [p.id, p]));
  return {
    intro: { ...base.intro, ...(over.intro || {}) },
    parts: (base.parts || []).map((part) => {
      const tp = overParts.get(part.id) || {};
      const tSections = new Map((tp.sections || []).map((s) => [s.id, s]));
      return {
        ...part,
        title: tp.title || part.title,
        blurb: tp.blurb || part.blurb,
        sections: (part.sections || []).map((section) => {
          const ts = tSections.get(section.id);
          if (!ts) return { ...section, untranslated: lang !== 'en' };
          return { ...section, ...ts, untranslated: false };
        }),
      };
    }),
  };
}

function renderLangSwitch() {
  const host = $('#lang');
  host.replaceChildren(
    ...LANGS.map((l) => {
      const btn = el('button', { type: 'button', textContent: l.label, lang: l.code });
      btn.setAttribute('aria-pressed', String(l.code === lang));
      btn.addEventListener('click', () => setLang(l.code));
      return btn;
    }),
  );
}

function setLang(next) {
  lang = next;
  store(LANG_KEY, next);
  // Chrome refuses replaceState on a file:// document — it has an opaque origin
  // — and opening the manual straight off disk is the normal way to read it.
  // Losing the ?lang= from the address bar is survivable; a language button that
  // throws before it can re-render, leaving the reader stuck in English, is not.
  try {
    const url = new URL(location.href);
    url.searchParams.set('lang', next);
    history.replaceState(null, '', url);
  } catch {}
  document.documentElement.lang = next;
  render();
}

/* --- Sidebar groups ----------------------------------------------------------
   Every group starts closed. One opens because the reader clicked it — pinned,
   and it stays open — or because they scrolled into it, and only one group is
   ever open that way. Both survive a re-render, so switching language does not
   shut the sidebar in the reader's face. */
const pinnedParts = new Set();
let autoPart = null;

const partIsOpen = (id) => pinnedParts.has(id) || autoPart === id;
const partElFor = (id) => document.querySelector('.toc-part[data-part="' + id + '"]');

function setPartOpen(partEl, open) {
  partEl.classList.toggle('open', open);
  partEl.querySelector('.toc-part-label').setAttribute('aria-expanded', String(open));
  partEl.querySelector('.toc-links').hidden = !open;
}

/** Which group a section lives in, going through the nav rather than the data. */
function partIdForSection(sectionId) {
  const link = document.querySelector('nav.toc a[data-for="' + sectionId + '"]');
  const part = link && link.closest('.toc-part');
  return part ? part.dataset.part : null;
}

/** Follow the reader: open the group they are in, close the one they left
    unless they pinned it open. Left alone while a search is running, because
    the search decides what is open for as long as there is a query. */
function setActivePart(sectionId) {
  const id = partIdForSection(sectionId);
  document.querySelectorAll('.toc-part').forEach((part) => {
    if (part.dataset.part === id) part.dataset.active = 'true';
    else delete part.dataset.active;
  });
  if (!id || id === autoPart || $('#search').value.trim()) return;
  if (autoPart && !pinnedParts.has(autoPart)) {
    const prev = partElFor(autoPart);
    if (prev) setPartOpen(prev, false);
  }
  autoPart = id;
  const next = partElFor(id);
  if (next) setPartOpen(next, true);
}

function renderToc(data) {
  const host = $('#toc');
  host.replaceChildren(
    ...data.parts.map((part) => {
      const listId = 'toc-list-' + part.id;

      const label = el(
        'button',
        { type: 'button', className: 'toc-part-label' },
        icon(part.icon),
        el('span', { className: 'toc-part-title', textContent: part.title }),
        icon('i-chevron', 'icon chev'),
      );
      label.setAttribute('aria-controls', listId);

      const links = el(
        'div',
        { className: 'toc-links', id: listId },
        ...part.sections.map((s) => {
          const a = el('a', { href: '#' + s.id, textContent: s.title });
          a.dataset.for = s.id;
          return a;
        }),
      );

      const wrap = el('div', { className: 'toc-part' }, label, links);
      wrap.dataset.part = part.id;
      setPartOpen(wrap, partIsOpen(part.id));

      label.addEventListener('click', () => {
        const open = !wrap.classList.contains('open');
        if (open) {
          pinnedParts.add(part.id);
        } else {
          pinnedParts.delete(part.id);
          if (autoPart === part.id) autoPart = null;
        }
        setPartOpen(wrap, open);
      });

      return wrap;
    }),
  );
}

function renderSection(section, part) {
  const node = el('section', { className: 'doc', id: section.id });
  node.dataset.search = [
    part ? part.title : '',
    section.title, section.summary,
    (section.steps || []).join(' '),
    (section.fields || []).map((f) => f.name + ' ' + f.what).join(' '),
    (section.notes || []).join(' '),
  ].join(' ').toLowerCase();

  const anchor = el('a', { className: 'anchor', href: '#' + section.id, title: 'Link to this section' });
  anchor.append(icon('i-link'));
  node.append(el('h2', {}, section.title, anchor));

  const chips = [];
  if (section.audience) {
    const map = { owner: 'audienceOwner', staff: 'audienceStaff', shopper: 'audienceShopper', developer: 'audienceDeveloper' };
    const ico = { owner: 'i-user-check', staff: 'i-users', shopper: 'i-store', developer: 'i-wrench' };
    chips.push(el('span', { className: 'chip' }, icon(ico[section.audience] || 'i-users'), t(map[section.audience])));
  }
  if (section.route) {
    chips.push(el('span', { className: 'chip' }, icon('i-route'), el('code', { textContent: section.route })));
  }
  if (chips.length) node.append(el('div', { className: 'meta-row' }, ...chips));

  if (section.untranslated) {
    node.append(el('p', { className: 'fallback-note' }, icon('i-globe'), t('fallback')));
  }

  if (section.summary) node.append(el('p', { textContent: section.summary }));

  if (section.steps && section.steps.length) {
    node.append(el('h3', { className: 'block-label' }, icon('i-list'), t('steps')));
    node.append(el('ol', { className: 'steps' }, ...section.steps.map((s) => el('li', { textContent: s }))));
  }

  if (section.fields && section.fields.length) {
    node.append(el('h3', { className: 'block-label' }, icon('i-form'), t('fields')));
    const rows = section.fields.map((f) =>
      el(
        'tr',
        {},
        el('td', {}, f.name, f.required ? el('span', { className: 'req', textContent: t('required') }) : null),
        el('td', { textContent: f.what }),

    node.append(el('table', { className: 'fields' }, el('tbody', {}, ...rows)));
  }

  if (section.notes && section.notes.length) {
    node.append(el('h3', { className: 'block-label' }, icon('i-info'), t('notes')));
    node.append(
      el('ul', { className: 'notes' }, ...section.notes.map((n) => el('li', {}, icon('i-alert'), n))),

  const host = $('#main-wrap');

function render() {
  const data = resolved();
  $('#brand-sub').textContent = subtitle();
  $('#search').placeholder = t('searchPlaceholder');

  $('#sibling').href = DOC.sibling.href;
  $('#sibling-icon').setAttribute('href', DOC.sibling.icon);
  $('#sibling-label').textContent = siblingLabel();
  renderLangSwitch();
  renderToc(data);
  renderMain(data);
  applySearch($('#search').value);

/* --- Search: hides sections that do not match, and their nav entries --------- */
let lastQuery = '';

function applySearch(raw) {
  const q = (raw || '').trim().toLowerCase();
  // Every word has to appear, but not next to each other: "barcode scanner"
  // should find the section that explains scanners even though those two words
  // are never written together in it.
  const terms = q.split(' ').filter(Boolean);
  const sections = document.querySelectorAll('section.doc');
  let visible = 0;
  sections.forEach((s) => {
    const hit = !q || terms.every((term) => s.dataset.search.includes(term));
    s.hidden = !hit;
    if (hit) visible++;
    const link = document.querySelector('nav.toc a[data-for="' + s.id + '"]');
    if (link) link.hidden = !hit;
  });
  document.querySelectorAll('.part-head').forEach((head) => {
    let next = head.nextElementSibling, any = false;
    while (next && next.classList.contains('doc')) {
      if (!next.hidden) any = true;
      next = next.nextElementSibling;
    }
    head.hidden = !any;
  });
  document.querySelectorAll('.toc-part').forEach((part) => {
    const surviving = part.querySelector('.toc-links a:not([hidden])');
    part.hidden = !surviving;
    // While there is a query, a group with results is open — hits the reader
    // cannot see are hits they do not have. Clearing the box hands the sidebar
    // back to whatever they had open themselves.
    setPartOpen(part, q ? Boolean(surviving) : partIsOpen(part.dataset.part));
  });
  const cards = document.querySelector('.cards');
  if (cards) cards.hidden = Boolean(q);
  // Only ever an empty *search* result. With no query there is nothing to say —
  // an empty manual should render as an empty manual, not as a failed search.
  const none = document.getElementById('no-results');
  if (none) none.hidden = !q || visible > 0;

  // A single character matches so much of the manual that marking it is noise,
  // and the walk is not worth it. Filtering still starts from one character.
  highlight($('#main-wrap'), terms.filter((term) => term.length >= 2));

  // Starting a search from halfway down leaves the reader parked in a region
  // that has just been hidden.
  if (q && !lastQuery) window.scrollTo({ top: 0 });
  lastQuery = q;
}

/** Mark the search terms inside the sections that survived, so it is obvious
 *  why each one is still on screen. No terms just clears the previous marks. */
function highlight(root, terms) {
  root.querySelectorAll('mark.hit').forEach((mark) => {
    const parent = mark.parentNode;
    parent.replaceChild(document.createTextNode(mark.textContent), mark);
    parent.normalize();
  });
  if (!terms.length) return;

  for (const section of root.querySelectorAll('section.doc:not([hidden])')) {
    for (const term of terms) {
      const walker = document.createTreeWalker(section, NodeFilter.SHOW_TEXT);
      const hits = [];
      // Collected first: replacing nodes while the walker is still on them
      // would cut the walk short. Text already inside a mark is left alone, so
      // two terms overlapping cannot nest one mark inside another.
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (node.parentNode.closest('mark.hit')) continue;
        if (node.nodeValue.toLowerCase().includes(term)) hits.push(node);
      }
      hits.forEach((node) => markMatches(node, term));
    }
  }
}

function markMatches(node, q) {
  const text = node.nodeValue;
  const lower = text.toLowerCase();
  const frag = document.createDocumentFragment();
  let at = 0;
  for (;;) {
    const found = lower.indexOf(q, at);
    if (found < 0) break;
    if (found > at) frag.append(text.slice(at, found));
    frag.append(el('mark', { className: 'hit', textContent: text.slice(found, found + q.length) }));
    at = found + q.length;
  }
  frag.append(text.slice(at));
  node.parentNode.replaceChild(frag, node);
}

/* --- Highlight the section currently in view -------------------------------- */
let observer = null;
function observeSections() {
  if (observer) observer.disconnect();
  const links = new Map(
    [...document.querySelectorAll('nav.toc a')].map((a) => [a.dataset.for, a]),
  );
  observer = new IntersectionObserver(
    (entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        links.forEach((a) => a.removeAttribute('aria-current'));
        const active = links.get(entry.target.id);
        setActivePart(entry.target.id);
        if (active) {
          active.setAttribute('aria-current', 'true');
          if (window.innerWidth > 1000) active.scrollIntoView({ block: 'nearest' });
        }
      }
    },
    { rootMargin: '-80px 0px -70% 0px', threshold: 0 },
  );
  document.querySelectorAll('section.doc').forEach((s) => observer.observe(s));
}

/* --- Deep links -------------------------------------------------------------
   The browser resolves #section before any of this has rendered, so a link into
   the manual has to be re-applied by hand once the section exists — and its
   group opened, or it would land the reader on a section the sidebar hides. */
function goToHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const target = document.getElementById(id);
  if (!target || target.hidden) return;
  setActivePart(id);
  target.scrollIntoView({ block: 'start' });
}

/* --- Theme ------------------------------------------------------------------ */
function applyTheme(mode) {
  const root = document.documentElement;
  if (mode === 'auto') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', mode);
  const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme-toggle').firstElementChild.firstElementChild.setAttribute('href', dark ? '#i-moon' : '#i-sun');
}

/* --- Wire up ---------------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(read(THEME_KEY) || 'auto');
  document.documentElement.lang = lang;
  render();
  goToHash();
  window.addEventListener('hashchange', goToHash);

  $('#search').addEventListener('input', (e) => applySearch(e.target.value));
  $('#search').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.target.value = ''; applySearch(''); }
  });

  $('#theme-toggle').addEventListener('click', () => {
    const current = read(THEME_KEY) || 'auto';
    const next = current === 'dark' ? 'light' : 'dark';
    store(THEME_KEY, next);
    applyTheme(next);
  });

  const toggle = $('#nav-toggle');
  toggle.addEventListener('click', () => {
    const open = $('#toc').classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  $('#toc').addEventListener('click', (e) => {
    if (e.target.closest('a') && window.innerWidth <= 1000) {
      $('#toc').classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      $('#search').focus();
    }
  });
});
</script>
</body>
</html>

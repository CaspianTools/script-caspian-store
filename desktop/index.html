<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Caspian Register</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      /* The register's own screens paint `--caspian-background`, but only once
         they are inside PosShell -- the sign-in and loading gates render above
         it and inherit whatever the page behind them is. In a browser that is
         the site's white body; in this window it is whatever is set here, so a
         dark backdrop turned the sign-in form into dark text on black. Match
         the library's surface instead of guessing one. */
      body {
        margin: 0;
        background: var(--caspian-background, #ffffff);
        color: var(--caspian-foreground, #111111);
      }
      /* Shown until React mounts. A till that looks dead for a second on a cold
         start is a support call, so the window says something immediately. */
      #boot {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        color: #6a6a6a;
        font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Starting the register…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

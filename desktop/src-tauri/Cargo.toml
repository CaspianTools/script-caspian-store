[package]
name = "caspian-register"
version = "0.1.0"
description = "Caspian Register — the in-person till, as a Windows app"
authors = ["Caspian Tools"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

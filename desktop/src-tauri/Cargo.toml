[package]
name = "caspian-register"
version = "1.0.1"
description = "Caspian Register — the offline in-person till, as a Windows app"
authors = ["Caspian Tools"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The Tauri v2 template baseline. Nothing here invokes a command any more, so
# neither is load-bearing today; they are kept because this crate is only ever
# compiled in CI and a red build costs more than two unused declarations.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

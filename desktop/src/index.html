<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up this till</title>
<style>
  :root {
    --bg: #ffffff; --text: #18181b; --muted: #62626b; --border: #d4d4d8;
    --accent: #1d4ed8; --accent-text: #ffffff; --danger: #b42318; --danger-bg: #fef3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0b0d; --text:#f4f4f5; --muted:#a1a1aa; --border:#3f3f46;
            --danger:#fda29b; --danger-bg:#2b1614; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .card { width: 100%; max-width: 420px; }
  .mark { width: 44px; height: 44px; border-radius: 10px; background: var(--accent); margin-bottom: 16px; }
  h1 { font-size: 19px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.lede { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: inherit;
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    -webkit-user-select: text; user-select: text;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  button {
    width: 100%; margin-top: 18px; padding: 11px 16px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: var(--danger-bg); color: var(--danger); font-size: 13px;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>Set up this till</h1>
    <p class="lede">Type your shop's web address. This is stored on this computer only, and you will not be asked again.</p>

    <label for="url">Shop address</label>
    <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="shop.example.com" autofocus>
    <div class="hint">Just the address — the register page is found automatically.</div>

    <button id="go" type="button">Open the register</button>
    <div class="error" id="error" role="alert"></div>
  </div>

<script>
  var input = document.getElementById('url');
  var button = document.getElementById('go');
  var error = document.getElementById('error');

  function fail(message) {
    error.textContent = message;
    error.classList.add('show');
    button.disabled = false;
    button.textContent = 'Open the register';
  }

  function submit() {
    var value = input.value.trim();
    if (!value) { fail("Enter your shop's web address."); return; }
    error.classList.remove('show');
    button.disabled = true;
    button.textContent = 'Opening…';

    // withGlobalTauri is on, so there is no bundler and no import step here.
    var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    if (!invoke) { fail('This window is not connected to the app. Close it and start again.'); return; }

    invoke('save_store_url', { url: value }).catch(function (e) {
      fail(typeof e === 'string' ? e : 'Could not open that address.');
    });
  }

  button.addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
